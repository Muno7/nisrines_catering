<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Basket - Nisrine's Kitchen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <main class="container mx-auto px-4 py-8 pt-[100px]">
    <!-- Order Summary Section -->
    <div class="flex flex-col lg:flex-row gap-8">
      <!-- Cart Items -->
      <div class="lg:w-2/3">
        <h1 class="text-3xl font-bold mb-6">Order Basket</h1>
        
        <div class="space-y-4">
          <!-- Cart Item -->
          <div class="product-container bg-white shadow-[0_0_10px_rgba(0,0,0,0.1)] rounded-[10px] overflow-hidden">
            <div class="flex flex-col sm:flex-row gap-4 p-4">
              <img class="w-full sm:w-[10rem] h-[10rem] object-cover rounded-[10px]" src="https://images.unsplash.com/photo-1529006557810-274b9b2fc783?q=80&w=2676&auto=format&fit=crop" alt="Chicken Shawarma">
              <div class="flex flex-col justify-between flex-grow">
                <div>
                  <h3 class="product-name-js text-xl font-bold mb-2">Chicken Shawarma Platter</h3>
                  <p class="text-gray-600 mb-4">Single Portion</p>
                </div>
                <div class="flex flex-wrap items-center gap-4">
                  <div class="flex items-center gap-2 w-full sm:w-auto">
                    <input type="number" min="1" value="1" class="w-20 text-center rounded-lg border-gray-300 shadow-sm focus:border-customBrown focus:ring-customBrown" />
                    <button class="update-quantity bg-customBrown text-white px-4 py-2 rounded-lg hover:bg-opacity-90 transition-colors">
                      Update
                    </button>
                  </div>
                  <p class="price-js text-lg font-semibold">$15.99</p>
                  <button class="text-red-500 hover:text-red-700 ml-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Another Cart Item -->
          <div class="product-container bg-white shadow-[0_0_10px_rgba(0,0,0,0.1)] rounded-[10px] overflow-hidden">
            <div class="flex flex-col sm:flex-row gap-4 p-4">
              <img class="w-full sm:w-[10rem] h-[10rem] object-cover rounded-[10px]" src="https://images.unsplash.com/photo-1544941968-1c6b2dd6c6b8?q=80&w=2670&auto=format&fit=crop" alt="Mediterranean Mezze">
              <div class="flex flex-col justify-between flex-grow">
                <div>
                  <h3 class="product-name-js text-xl font-bold mb-2">Mediterranean Mezze Platter</h3>
                  <p class="text-gray-600 mb-4">Family Portion</p>
                </div>
                <div class="flex flex-wrap items-center gap-4">
                  <div class="flex items-center gap-2 w-full sm:w-auto">
                    <input type="number" min="1" value="2" class="w-20 text-center rounded-lg border-gray-300 shadow-sm focus:border-customBrown focus:ring-customBrown" />
                    <button class="update-quantity bg-customBrown text-white px-4 py-2 rounded-lg hover:bg-opacity-90 transition-colors">
                      Update
                    </button>
                  </div>
                  <p class="price-js text-lg font-semibold">$24.99</p>
                  <button class="text-red-500 hover:text-red-700 ml-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="lg:w-1/3">
        <div class="bg-white shadow-[0_0_10px_rgba(0,0,0,0.1)] rounded-[10px] p-6 sticky top-[100px]">
          <h2 class="text-2xl font-bold mb-6">Order Summary</h2>
          
          <div class="space-y-4">
            <div class="flex justify-between">
              <span>Subtotal</span>
              <span>$65.97</span>
            </div>
            <div class="flex justify-between">
              <span>Delivery Fee</span>
              <span>$5.00</span>
            </div>
            <div class="border-t pt-4 flex justify-between font-bold">
              <span>Total</span>
              <span>$70.97</span>
            </div>
          </div>

          <!-- Delivery Information -->
          <div class="mt-8 space-y-4">
            <h3 class="font-bold text-lg">Delivery Information</h3>
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-customBrown focus:ring-customBrown">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input type="tel" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-customBrown focus:ring-customBrown">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Delivery Address</label>
                <textarea 
                  class="w-full rounded-lg border-gray-300 shadow-sm focus:border-customBrown focus:ring-customBrown" 
                  rows="3" 
                  maxlength="200"
                  style="resize: none;"
                ></textarea>
                <p class="text-xs text-gray-500 mt-1">Maximum 200 characters</p>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Special Instructions</label>
                <textarea 
                  class="w-full rounded-lg border-gray-300 shadow-sm focus:border-customBrown focus:ring-customBrown" 
                  rows="2" 
                  maxlength="100"
                  placeholder="Any special instructions for delivery?"
                  style="resize: none;"
                ></textarea>
                <p class="text-xs text-gray-500 mt-1">Maximum 100 characters</p>
              </div>
            </div>
          </div>

          <button class="w-full bg-customBrown text-white rounded-lg py-4 mt-6 font-semibold hover:bg-opacity-90 transition-colors fixed bottom-4 left-4 right-4 lg:static lg:bottom-auto lg:left-auto lg:right-auto">
            Place Order
          </button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
