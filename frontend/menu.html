<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nisrine's Catering | Menu</title>
  <link rel="icon" type="image/png" href="/assets/favicons/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg">
  <link rel="shortcut icon" href="/assets/favicons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png">
  <link rel="manifest" href="/assets/favicons/site.webmanifest">
  <link rel="stylesheet" href="./public/styles/output.css">
  <link rel="stylesheet" href="./public/styles/header.css">
  <link rel="stylesheet" href="./public/styles/general.css">
  <link rel="stylesheet" href="./public/styles/product.css">
  <link rel="stylesheet" href="./public/styles/menu.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div data-component="header"></div>
  <main class="pt-[100px]">
    <div class="container mx-auto py-2 md:py-8 space-y-8 menu-sections">
      <section class="lg:px-8 lg:py-4 space-y-6">
        <div class="px-4 lg:px-0">
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="h-[280px] bg-gray-200 rounded-xl animate-pulse"></div>
            <div class="h-[280px] bg-gray-200 rounded-xl animate-pulse"></div>
            <div class="h-[280px] bg-gray-200 rounded-xl animate-pulse"></div>
            <div class="h-[280px] bg-gray-200 rounded-xl animate-pulse"></div>
            <div class="h-[280px] bg-gray-200 rounded-xl animate-pulse"></div>
            <div class="h-[280px] bg-gray-200 rounded-xl animate-pulse"></div>
            <div class="h-[280px] bg-gray-200 rounded-xl animate-pulse"></div>
            <div class="h-[280px] bg-gray-200 rounded-xl animate-pulse"></div>
          </div>
        </div>
      </section>
    </div>
    <!-- Full-screen product Overlay -->
    <div class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 pt-8 pb-12 sm:p-6 sm:pt-10 sm:pb-14" id="overlay">

    </div>  
  </main>
  <div data-component="footer"></div>
  <!-- Notification Overlay -->
  <div id="notification-overlay" class="fixed inset-0 z-50 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-surface rounded-lg shadow-xl max-w-md w-full mx-4 transform scale-95 transition-transform duration-300" id="modalContent">
      <div class="p-6">
        <div class="flex items-center mb-4">
          <div class="bg-secondary/10 rounded-full p-3 mr-4">
            <svg class="text-secondary" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16">
              <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-text">Order Day Conflict</h2>
        </div>
        <div class="space-y-4 text-muted">
          <p class="text-lg">
            This meal is only available for <span class="product-day font-semibold text-text">Thursday</span>.
          </p>
          <p class="text-lg">
            Your basket already contains products for <span class="current-day font-semibold text-text">Tuesday</span>.
          </p>
          <p class="text-lg">
            To order for <span class="product-day font-semibold text-text">Thursday</span>, please place a separate order.
          </p>
        </div>
        <button id="notification-close-btn" class="mt-6 w-full bg-secondary hover:bg-secondary-hover text-white font-semibold py-3 px-4 rounded-lg transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-opacity-50">
          Close
        </button>
      </div>
    </div>
  </div>
  <script src="./src/scripts/pages/menu.js" type="module"></script>
</body>
</html>
