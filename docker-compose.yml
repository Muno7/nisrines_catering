services:
  db:
    image: postgres:16
    env_file:
      - ./.env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - ./.env.prod
    depends_on:
      - db
    restart: unless-stopped
    # Only bind API to localhost on the host machine (NOT public)
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata: