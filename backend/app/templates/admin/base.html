<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Admin{% endblock %} | Nisrine's Catering</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="page">
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">NC</div>
          <div>
            <p class="eyebrow">Nisrine's Catering</p>
            <p class="brand-title">Operations Dashboard</p>
          </div>
        </div>
        <div class="top-actions">
          {% if current_user.is_authenticated %}
            <a class="btn btn-ghost" href="{{ url_for('admin.logout') }}">Logout</a>
          {% endif %}
        </div>
      </header>
      {% include "admin/includes/flash_messages.html" %}
      <div class="panel">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  {% include "admin/includes/confirm_modal.html" %}
  <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
  <script src="{{ url_for('static', filename='js/confirm.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sortable.js') }}"></script>
</body>
</html>
