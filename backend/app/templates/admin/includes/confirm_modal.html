<div class="modal-backdrop" id="confirm-modal" hidden>
  <div class="modal">
    <header>
      <h3>Confirm action</h3>
    </header>
    <p id="confirm-message" class="muted">Are you sure?</p>
    <div class="modal-actions">
      <button id="confirm-no" class="btn btn-ghost" type="button">Cancel</button>
      <button id="confirm-yes" class="btn btn-danger" type="button">Delete</button>
    </div>
  </div>
</div>
